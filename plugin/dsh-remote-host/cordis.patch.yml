# dsh-remote-host 的 bundle 补丁层：向宿主插件树里插入我们的桥接插件。
#
# 插件只做一件事：把当前宿主（Desktop App 或 dsh --profile 启动的 host）的
# 127.0.0.1 origin 与带 token 的 authenticatedUrl 写成
#   $DSH_HOME/remote/host-<profile>.json
# 供 dshremote daemon 以“接管模式”连接（不再自己 spawn 一个 host，从而避免
# 两个宿主争抢同一份会话写句柄）。
- insert:
    - id: dsh-remote-host
      name: dsh-remote-host
